name: ivalid
description: "Ivalid - Plataforma de combate ao desperdício alimentar."
publish_to:

environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State Management
  provider: ^6.1.2

  # Image loading
  cached_network_image: ^3.4.1

  # Typography
  google_fonts: ^8.0.2

  # Date formatting
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0

  # Pagamento online (InfinitePay): chamadas à API e checkout em WebView
  http: ^1.2.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
